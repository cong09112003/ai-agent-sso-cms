# nginx config inside the app container: serves the CRA build as an SPA on port 80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed CRA assets never change, so cache them for a long time
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deploy is picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
